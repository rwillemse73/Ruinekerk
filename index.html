<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reisdagboek</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1ea;color:#26353a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:14px 16px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:1000}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:#6c787c}
#map{height:45vh;min-height:320px}.panel{padding:12px 14px}.toolbar{display:flex;flex-wrap:wrap;gap:6px}
button{border:0;border-radius:10px;padding:10px 12px;background:#26353a;color:#fff;font-size:14px}
button.light{background:#e8e5df;color:#26353a}.status{font-size:13px;padding:8px 2px}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 2px #0000000b}
.card h2{margin:0 0 4px;font-size:18px}.meta{font-size:12px;color:#6a777b}.story{font-size:14px;line-height:1.55;margin-top:8px}
.fact{padding:5px 0;border-bottom:1px solid #eee;font-size:13px}.badge{display:inline-block;background:#eee;border-radius:20px;padding:3px 8px;font-size:11px;margin-bottom:6px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:3000;padding:14px;overflow:auto}.box{background:#fff;border-radius:16px;padding:16px;max-width:650px;margin:20px auto}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px}input,textarea,select{width:100%;padding:10px;border:1px solid #c9c9c9;border-radius:9px;font:inherit}textarea{min-height:110px}
.notice{background:#fff6cf;border-radius:10px;padding:9px;font-size:12px;margin-top:10px}.small{font-size:11px;color:#6b777b}
img.preview{max-width:100%;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<header><h1>Reisdagboek</h1><div class="sub">Locaties ontdekken én je eigen herinneringen bewaren</div></header>
<div id="map"></div>
<section class="panel">
<div class="toolbar">
<button onclick="realGPS()">📍 Mijn locatie</button>
<button onclick="testGPS()">🧪 Testpositie</button>
<button onclick="addLocation()">➕ Locatie</button>
<button class="light" onclick="showAll()">🗺️ Alles</button>
</div>
<div id="status" class="status">Gebruik de testpositie om de app thuis te testen.</div>
<div id="list"></div>
</section>

<div id="modal" class="modal"><div class="box">
<h2 id="mtitle">Locatie</h2><div id="form"></div>
<button onclick="save()">Opslaan</button> <button class="light" onclick="closeModal()">Annuleren</button>
</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const seed={"locations": [{"id": "ruinekerk", "name": "Ruïnekerk", "type": "bezienswaardigheid", "lat": 52.7, "lon": 4.75, "coordinate_status": "testpunt", "content": "locaties/ruinekerk.html", "editorial": {"facts": [{"label": "Status", "value": "Bestaande testlocatie"}], "main_image": null}, "personal": {"visited": false, "visited_dates": [], "rating": null, "notes": [], "photos": []}}, {"id": "skarpet", "name": "Strandbad Skarpet", "type": "natuur/recreatie", "lat": 52.7012, "lon": 4.7494, "coordinate_status": "testpunt", "content": "locaties/skarpet.html", "editorial": {"facts": [{"label": "Status", "value": "Bestaande testlocatie"}], "main_image": null}, "personal": {"visited": false, "visited_dates": [], "rating": null, "notes": [], "photos": []}}], "test": {"lat": 52.7, "lon": 4.75}};
let locs=JSON.parse(localStorage.getItem('reisdagboek_locations_v3')||'null')||seed.locations;
let lat=null,lon=null,editing=null,journalOnly=false;
const map=L.map('map').setView([seed.test.lat,seed.test.lon],16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const markers=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function d(a,b,c,e){const R=6371000,p=Math.PI/180,A=(c-a)*p,B=(e-b)*p,q=Math.sin(A/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(B/2)**2;return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));}
function fm(n){return n<1000?Math.round(n)+' m':(n/1000).toFixed(1)+' km';}
function draw(){
 markers.forEach(m=>map.removeLayer(m));markers.length=0;
 locs.forEach(x=>{if(x.lat==null)return;let m=L.marker([x.lat,x.lon]).addTo(map).bindPopup('<b>'+esc(x.name)+'</b><br>'+esc(x.type));m.on('click',()=>card(x.id));markers.push(m)});
 render();
}
function render(){
 if(lat==null){document.getElementById('list').innerHTML='<div class="card">Druk op 🧪 Testpositie om de proef thuis te starten.</div>';return}
 let a=locs.filter(x=>x.lat!=null).map(x=>({...x,dist:d(lat,lon,x.lat,x.lon)})).sort((a,b)=>a.dist-b.dist);
 let n=a.filter(x=>x.dist<=500);
 document.getElementById('status').textContent=n.length+' locatie(s) binnen 500 meter • 250 m = verhaalzone';
 document.getElementById('list').innerHTML=n.length?n.map(x=>{
   let in250=x.dist<=250;
   let p=x.personal||{};
   return `<div class="card" id="c-${x.id}">
   <span class="badge">${in250?'BINNEN 250 M':'BINNEN 500 M'}</span>
   <h2>${esc(x.name)}</h2><div class="meta">${esc(x.type)} · ${fm(x.dist)}</div>
   ${in250?`<div class="story">${esc(x.story||'')}</div>`:'<div class="small">Het verhaal wordt beschikbaar binnen 250 meter.</div>'}
   ${(x.facts||[]).map(f=>`<div class="fact"><b>${esc(f.label)}:</b> ${esc(f.value)}</div>`).join('')}
   <div class="meta">Bezocht: ${p.visited?'ja':'nee'}${p.rating?' · ⭐ '+p.rating+'/5':''}</div>
   <div class="toolbar"><button onclick="edit('${x.id}')">✏️ Bewerken</button><button class="light" onclick="journal('${x.id}')">📝 Dagboek</button></div>
   </div>`}).join(''):'<div class="card">Geen locaties binnen 500 meter.</div>';
}
function card(id){document.getElementById('c-'+id)?.scrollIntoView({behavior:'smooth'});}
function testGPS(){lat=seed.test.lat;lon=seed.test.lon;map.setView([lat,lon],16);render();}
function realGPS(){if(!navigator.geolocation){alert('GPS wordt niet ondersteund.');return}navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lon=p.coords.longitude;map.setView([lat,lon],16);render()},()=>alert('Locatie kon niet worden bepaald. Controleer de locatie-toestemming.'))}
function showAll(){if(markers.length)map.fitBounds(L.featureGroup(markers).getBounds().pad(.2));}
function addLocation(){editing=null;journalOnly=false;document.getElementById('mtitle').textContent='Nieuwe locatie';form({name:'',type:'restaurant',story:'',facts:[],lat:lat??seed.test.lat,lon:lon??seed.test.lon,personal:{visited:true,visited_dates:[new Date().toISOString().slice(0,10)],rating:null,notes:[]}});open();}
function edit(id){editing=id;journalOnly=false;let x=locs.find(a=>a.id==id);document.getElementById('mtitle').textContent='Locatie bewerken';form(x);open();}
function journal(id){editing=id;journalOnly=true;let x=locs.find(a=>a.id==id);document.getElementById('mtitle').textContent='Mijn dagboek';form(x);open();}
function form(x){
let p=x.personal||{};
document.getElementById('form').innerHTML=`
${!journalOnly?`<label>Naam</label><input id="name" value="${esc(x.name)}">
<label>Type</label><select id="type">${['bezienswaardigheid','natuur','historie','restaurant','cafe','hotel','eigen-herinnering','anders'].map(t=>`<option ${x.type==t?'selected':''}>${t}</option>`).join('')}</select>
<label>Verhaal</label><textarea id="story">${esc(x.story||'')}</textarea>
<label>Feiten (label | waarde)</label><textarea id="facts">${(x.facts||[]).map(f=>f.label+' | '+f.value).join('\\n')}</textarea>
<label>GPS</label><div class="small">${x.lat}, ${x.lon}</div>`:''}
<label>Bezocht</label><select id="visited"><option value="false">Nee</option><option value="true" ${p.visited?'selected':''}>Ja</option></select>
<label>Beoordeling</label><select id="rating"><option value="">Geen</option>${[1,2,3,4,5].map(i=>`<option value="${i}" ${p.rating==i?'selected':''}>${i}</option>`).join('')}</select>
<label>Mijn notitie</label><textarea id="note">${esc(p.notes?.slice(-1)[0]?.text||'')}</textarea>
<label>Foto (test)</label><input type="file" id="photo" accept="image/*">
<div class="notice">De gegevens worden voor deze proef lokaal op je telefoon opgeslagen. Ze worden niet automatisch naar GitHub gestuurd.</div>`;
}
function open(){document.getElementById('modal').style.display='block'}function closeModal(){document.getElementById('modal').style.display='none'}
function save(){
let x=editing?locs.find(a=>a.id==editing):null;
if(!x){x={id:'user-'+Date.now(),lat:lat??seed.test.lat,lon:lon??seed.test.lon,personal:{visited:false,visited_dates:[],rating:null,notes:[],photos:[]},facts:[]};locs.push(x)}
if(!journalOnly){x.name=document.getElementById('name').value;x.type=document.getElementById('type').value;x.story=document.getElementById('story').value;x.facts=document.getElementById('facts').value.split('\\n').filter(Boolean).map(s=>{let [a,...b]=s.split('|');return {label:a.trim(),value:b.join('|').trim()}})}
x.personal=x.personal||{visited:false,visited_dates:[],rating:null,notes:[],photos:[]};
x.personal.visited=document.getElementById('visited').value==='true';x.personal.rating=document.getElementById('rating').value?Number(document.getElementById('rating').value):null;
let note=document.getElementById('note').value.trim();if(note)x.personal.notes.push({date:new Date().toISOString().slice(0,10),text:note});
localStorage.setItem('reisdagboek_locations_v3',JSON.stringify(locs));closeModal();draw();
}
const seed2=seed;seed.test={lat:52.7000,lon:4.7500};
draw();
</script>
</body></html>
