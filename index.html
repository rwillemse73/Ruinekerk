<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183948">
<title>GPS-test Ruïnekerk</title>
<style>
body{margin:0;background:#f5f2eb;color:#293438;font-family:Arial,sans-serif}
main{max-width:520px;margin:auto;padding:24px}
.card{background:white;border-radius:16px;padding:22px;box-shadow:0 3px 15px #0001}
h1{color:#183948;font-size:27px}
button{width:100%;padding:16px;border:0;border-radius:10px;background:#3e7a77;color:white;font-size:16px;font-weight:bold}
#result{margin-top:20px;font-size:18px;line-height:1.5}
.small{font-size:13px;color:#667;line-height:1.5}
</style>
</head>
<body>
<main>
<div class="card">
<h1>📍 GPS-test Ruïnekerk</h1>
<p>Deze proef doet maar één ding: bepalen hoe ver je van de Ruïnekerk Oude Niedorp bent.</p>
<button onclick="locate()">Gebruik mijn locatie</button>
<div id="result"></div>
<p class="small">Voor deze test gebruiken we als proefpunt: 52.719804, 4.878203.</p>
</div>
</main>
<script>
const target={lat:52.719804,lon:4.878203};
function distance(a,b,c,d){
 const R=6371000,p=Math.PI/180;
 const x=(c-a)*p,y=(d-b)*p;
 const q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;
 return 2*R*Math.asin(Math.sqrt(q));
}
function locate(){
 const r=document.getElementById('result');
 if(!navigator.geolocation){r.textContent='Deze browser ondersteunt geen GPS.';return;}
 r.textContent='📡 Locatie wordt bepaald…';
 navigator.geolocation.getCurrentPosition(
  pos=>{
   const m=Math.round(distance(pos.coords.latitude,pos.coords.longitude,target.lat,target.lon));
   r.innerHTML='✅ GPS werkt.<br><br><b>Afstand tot het proefpunt: '+m+' meter</b><br><br>Je huidige GPS-coördinaten zijn ontvangen.';
  },
  err=>{
   r.innerHTML='❌ GPS kon niet worden gelezen.<br><br>Controleer of Chrome toestemming heeft om je locatie te gebruiken.';
  },
  {enableHighAccuracy:true,timeout:15000,maximumAge:0}
 );
}
</script>
</body>
</html>
