<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ruïnekerk – Reisdagboek</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1ea;color:#26353a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:14px 16px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:1000}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:#6c787c}
#map{height:45vh;min-height:320px}
.panel{padding:12px 14px}.toolbar{display:flex;flex-wrap:wrap;gap:6px}
button{border:0;border-radius:10px;padding:10px 12px;background:#26353a;color:#fff;font-size:14px}
button.light{background:#e8e5df;color:#26353a}
.status{font-size:13px;padding:8px 2px}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0}
.card h2{margin:0 0 4px;font-size:18px}.meta{font-size:12px;color:#6a777b}
.story{font-size:14px;line-height:1.55;margin-top:8px}
.fact{padding:5px 0;border-bottom:1px solid #eee;font-size:13px}
.badge{display:inline-block;background:#eee;border-radius:20px;padding:3px 8px;font-size:11px;margin-bottom:6px}
.notice{background:#fff6cf;border-radius:10px;padding:9px;font-size:12px;margin-top:10px}
.error{background:#ffe4e4;color:#7b2020;border-radius:10px;padding:12px;margin:10px 0;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:3000;padding:14px;overflow:auto}
.box{background:#fff;border-radius:16px;padding:16px;max-width:650px;margin:20px auto}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px}
input,textarea,select{width:100%;padding:10px;border:1px solid #c9c9c9;border-radius:9px;font:inherit}
textarea{min-height:110px}
.small{font-size:11px;color:#6b777b}
</style>
</head>
<body>
<header>
<h1>Ruïnekerk – Reisdagboek</h1>
<div class="sub">Locaties worden altijd uit locaties.json geladen</div>
</header>

<div id="map"></div>

<section class="panel">
<div class="toolbar">
<button onclick="realGPS()">📍 Mijn locatie</button>
<button onclick="testGPS()">🧪 Testpositie</button>
<button onclick="addLocation()">➕ Locatie</button>
<button class="light" onclick="showAll()">🗺️ Alles</button>
<button class="light" onclick="reloadLocations()">🔄 Locaties vernieuwen</button>
</div>
<div id="status" class="status">Locaties worden geladen…</div>
<div id="message"></div>
<div id="list"></div>
</section>

<div id="modal" class="modal">
<div class="box">
<h2 id="mtitle">Locatie</h2>
<div id="form"></div>
<button onclick="save()">Opslaan</button>
<button class="light" onclick="closeModal()">Annuleren</button>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let locations=[];
let userLat=null,userLon=null,editing=null,journalOnly=false;
let markers=[];
let map=L.map('map').setView([52.72,4.88],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,
 attribution:'© OpenStreetMap contributors'
}).addTo(map);

function esc(s){
 return String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
 }[c]));
}

function distance(a,b,c,d){
 const R=6371000,p=Math.PI/180,A=(c-a)*p,B=(d-b)*p;
 const q=Math.sin(A/2)**2+
   Math.cos(a*p)*Math.cos(c*p)*Math.sin(B/2)**2;
 return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
}

function fmt(m){
 return m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km';
}

async function loadLocations(){
 const url='locaties.json?v='+Date.now();
 try{
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok) throw new Error('HTTP '+response.status);
  const data=await response.json();
  locations=data.locations||[];
  document.getElementById('message').innerHTML=
    '<div class="notice">Locaties geladen uit <b>locaties.json</b> · versie '+esc(data.version||'?')+'</div>';
  drawMarkers();
  render();
 }catch(e){
  document.getElementById('message').innerHTML=
    '<div class="error">locaties.json kon niet worden geladen. Controleer of het bestand naast index.html staat.</div>';
  document.getElementById('status').textContent='Fout bij laden van locaties.';
 }
}

function reloadLocations(){
 loadLocations();
}

function drawMarkers(){
 markers.forEach(m=>map.removeLayer(m));
 markers=[];
 locations.forEach(x=>{
  if(x.lat==null||x.lon==null)return;
  const m=L.marker([x.lat,x.lon]).addTo(map)
    .bindPopup('<b>'+esc(x.name)+'</b><br>'+esc(x.address||x.type||''));
  m.on('click',()=>scrollCard(x.id));
  markers.push(m);
 });
}

function render(){
 if(userLat==null){
  document.getElementById('list').innerHTML=
   '<div class="card">Gebruik 🧪 Testpositie om thuis te testen, of 📍 Mijn locatie wanneer je ter plaatse bent.</div>';
  return;
 }

 const nearby=locations
  .filter(x=>x.lat!=null&&x.lon!=null)
  .map(x=>({...x,dist:distance(userLat,userLon,x.lat,x.lon)}))
  .sort((a,b)=>a.dist-b.dist);

 const within=nearby.filter(x=>x.dist<=500);
 document.getElementById('status').textContent=
   within.length+' locatie(s) binnen 500 meter · 250 m = verhaalzone';

 document.getElementById('list').innerHTML=within.length?
 within.map(x=>{
  const in250=x.dist<=250;
  const facts=x.editorial?.facts||x.facts||[];
  const storyPath=x.content||x.editorial?.story;
  return `<div class="card" id="card-${esc(x.id)}">
   <span class="badge">${in250?'BINNEN 250 M':'BINNEN 500 M'}</span>
   <h2>${esc(x.name)}</h2>
   <div class="meta">${esc(x.type||'')} · ${fmt(x.dist)}${x.address?' · '+esc(x.address):''}</div>
   ${in250?
     `<div class="story" id="story-${esc(x.id)}">Verhaal wordt geladen…</div>`:
     `<div class="small">Het verhaal wordt beschikbaar binnen 250 meter.</div>`}
   ${facts.map(f=>`<div class="fact"><b>${esc(f.label)}:</b> ${esc(f.value)}</div>`).join('')}
   <div class="toolbar">
    <button onclick="editLocation('${esc(x.id)}')">✏️ Bewerken</button>
    <button class="light" onclick="journal('${esc(x.id)}')">📝 Dagboek</button>
   </div>
  </div>`;
 }).join(''):
 '<div class="card">Geen locaties binnen 500 meter.</div>';

 within.filter(x=>x.dist<=250).forEach(loadStory);
}

async function loadStory(x){
 const el=document.getElementById('story-'+x.id);
 if(!el)return;
 const path=x.content||x.editorial?.story;
 if(!path){
  el.textContent='Geen contentbestand gekoppeld.';
  return;
 }
 try{
  const response=await fetch(path+'?v='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const text=await response.text();
  const parsed=new DOMParser().parseFromString(text,'text/html');
  el.innerHTML=parsed.querySelector('article')?.innerHTML||parsed.body.innerHTML;
 }catch(e){
  el.textContent='Het verhaal kon niet worden geladen.';
 }
}

function scrollCard(id){
 document.getElementById('card-'+id)?.scrollIntoView({behavior:'smooth'});
}

function testGPS(){
 userLat=52.719804;
 userLon=4.878203;
 map.setView([userLat,userLon],15);
 render();
}

function realGPS(){
 if(!navigator.geolocation){
  alert('GPS wordt niet ondersteund.');
  return;
 }
 navigator.geolocation.getCurrentPosition(
  p=>{
   userLat=p.coords.latitude;
   userLon=p.coords.longitude;
   map.setView([userLat,userLon],16);
   render();
  },
  ()=>alert('Locatie kon niet worden bepaald. Controleer de locatie-toestemming.')
 );
}

function showAll(){
 if(markers.length){
  map.fitBounds(L.featureGroup(markers).getBounds().pad(.25));
 }
}

function addLocation(){
 editing=null;journalOnly=false;
 document.getElementById('mtitle').textContent='Nieuwe locatie';
 openModal();
 document.getElementById('form').innerHTML=`
  <label>Naam</label><input id="name">
  <label>Type</label>
  <select id="type">
   <option>restaurant</option><option>cafe</option><option>hotel</option>
   <option>bezienswaardigheid</option><option>natuur</option>
   <option>historie</option><option>eigen-herinnering</option>
  </select>
  <label>Verhaal</label><textarea id="story"></textarea>
  <label>GPS</label><div class="small">${userLat??''} ${userLon??''}</div>
  <label>Mijn notitie</label><textarea id="note"></textarea>
  <div class="notice">Nieuwe locaties worden in deze proef lokaal op de telefoon opgeslagen. De centrale locaties.json wordt niet door de browser gewijzigd.</div>`;
}

function editLocation(id){
 const x=locations.find(a=>a.id===id); if(!x)return;
 editing=id;journalOnly=false;
 document.getElementById('mtitle').textContent='Locatie bewerken';
 openModal();
 document.getElementById('form').innerHTML=`
  <label>Naam</label><input id="name" value="${esc(x.name)}">
  <label>Type</label><input id="type" value="${esc(x.type||'')}">
  <label>Verhaal</label><textarea id="story">${esc('')}</textarea>
  <label>Adres</label><input id="address" value="${esc(x.address||'')}">
  <div class="small">Centrale GPS: ${esc(x.lat)}, ${esc(x.lon)}</div>
  <label>Mijn notitie</label><textarea id="note"></textarea>
  <div class="notice">De centrale bestanden worden niet gewijzigd; deze bewerking is lokaal.</div>`;
}

function journal(id){
 const x=locations.find(a=>a.id===id); if(!x)return;
 editing=id;journalOnly=true;
 document.getElementById('mtitle').textContent='Mijn dagboek';
 openModal();
 document.getElementById('form').innerHTML=`
  <label>Bezocht</label>
  <select id="visited"><option>Nee</option><option>Ja</option></select>
  <label>Beoordeling</label>
  <select id="rating"><option value="">Geen</option>
   <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
  </select>
  <label>Mijn notitie</label><textarea id="note"></textarea>`;
}

function openModal(){document.getElementById('modal').style.display='block'}
function closeModal(){document.getElementById('modal').style.display='none'}

function save(){
 const key='reisdagboek_user_changes_v1';
 let changes=JSON.parse(localStorage.getItem(key)||'{}');
 const id=editing||('user-'+Date.now());
 changes[id]=changes[id]||{personal:{notes:[]}};
 if(!journalOnly){
  changes[id].name=document.getElementById('name')?.value||'';
  changes[id].type=document.getElementById('type')?.value||'';
  changes[id].story=document.getElementById('story')?.value||'';
  changes[id].address=document.getElementById('address')?.value||'';
 }
 const note=document.getElementById('note')?.value?.trim();
 if(note){
  changes[id].personal=changes[id].personal||{notes:[]};
  changes[id].personal.notes.push({
   date:new Date().toISOString().slice(0,10),text:note
  });
 }
 localStorage.setItem(key,JSON.stringify(changes));
 closeModal();
 alert('Opgeslagen op deze telefoon. Centrale locaties.json blijft ongewijzigd.');
}

loadLocations();
</script>
</body>
</html>
